# =============================================================================
# User Queries & Mutations - Executable GraphQL Operations
# =============================================================================

# -----------------------------------------------------------------------------
# Mutations - Authentication
# -----------------------------------------------------------------------------

"""
Sign up with email and password
Creates a new user account and returns authentication tokens
"""
mutation SignUp($email: String!, $password: String!, $firstName: String!, $lastName: String) {
  signUp(email: $email, password: $password, firstName: $firstName, lastName: $lastName) {
    ok
    errors
    userExists
    requiresVerification
    authPayload {
      accessToken
      sessionToken
      refreshToken
      expiresIn
      user {
        id
        email
        firstName
        lastName
        fullName
        isEmailVerified
        authProvider
        profile {
          isOnboardingCompleted
        }
      }
    }
  }
}

"""
Sign in with email and password
Returns authentication tokens for existing user
"""
mutation SignIn($email: String!, $password: String!) {
  signIn(email: $email, password: $password) {
    ok
    errors
    authPayload {
      accessToken
      sessionToken
      refreshToken
      expiresIn
      user {
        id
        email
        firstName
        lastName
        fullName
        isEmailVerified
        authProvider
        lastLoginAt
        profile {
          isOnboardingCompleted
          isPremium
        }
      }
    }
  }
}

"""
Sign in with Google OAuth
Handles both new user registration and existing user login
"""
mutation GoogleSignIn($idToken: String!) {
  googleSignIn(idToken: $idToken) {
    ok
    errors
    isNewUser
    authPayload {
      accessToken
      sessionToken
      refreshToken
      expiresIn
      user {
        id
        email
        firstName
        lastName
        fullName
        isEmailVerified
        authProvider
        profile {
          isOnboardingCompleted
        }
      }
    }
  }
}

"""
Sign out from current device
Revokes the current session and refresh token
"""
mutation SignOut($refreshToken: String!) {
  signOut(refreshToken: $refreshToken) {
    ok
    errors
  }
}

"""
Sign out from all devices
Revokes all sessions and refresh tokens for the user
Use for security purposes (password change, compromised account)
"""
mutation SignOutAll($refreshToken: String!) {
  signOutAll(refreshToken: $refreshToken) {
    ok
    errors
  }
}

"""
Refresh access token
Use the refresh token to get a new access token
Implements sliding expiration - extends refresh token validity
"""
mutation RefreshAccessToken($refreshToken: String!) {
  refreshAccessToken(refreshToken: $refreshToken) {
    ok
    errors
    accessToken
    refreshToken
    expiresIn
  }
}

# -----------------------------------------------------------------------------
# Queries - User Data
# -----------------------------------------------------------------------------

"""
Get current authenticated user
Requires valid access token in Authorization header
"""
query Me {
  me {
    id
    email
    firstName
    lastName
    fullName
    profilePicture
    isEmailVerified
    authProvider
    dateJoined
    lastLoginAt
    profile {
      bio
      location
      coordinates
      hasLocation
      timezone
      birthDate
      phoneNumber
      isOnboardingCompleted
      isProfilePublic
      allowEmailNotifications
      allowPushNotifications
      calendarIntegrated
      calendarProvider
      paymentPlan
      isPremium
      subscriptionExpiresAt
      interests {
        id
        name
        icon
      }
      theme
      lastActiveAt
      loginCount
    }
    activeSessions {
      id
      deviceInfo
      ipAddress
      isActive
      createdAt
      lastActiveAt
    }
    sessionCount
  }
}

"""
Get user by ID (admin or self only)
"""
query GetUser($id: ID!) {
  user(id: $id) {
    id
    email
    firstName
    lastName
    fullName
    profilePicture
    isActive
    isEmailVerified
    authProvider
    dateJoined
  }
}

"""
Get user profile by user ID
"""
query GetProfile($userId: ID!) {
  profile(userId: $userId) {
    bio
    location
    coordinates
    hasLocation
    interests {
      id
      name
      description
      icon
    }
    isOnboardingCompleted
    isProfilePublic
    paymentPlan
    isPremium
    theme
  }
}

"""
Get all available interests
For onboarding and profile editing
"""
query GetInterests {
  interests {
    id
    name
    description
    icon
  }
}

"""
Get user's active sessions
For "Manage devices" feature
"""
query GetActiveSessions {
  me {
    activeSessions {
      id
      sessionToken
      deviceInfo
      ipAddress
      isActive
      createdAt
      lastActiveAt
    }
    sessionCount
  }
}

# -----------------------------------------------------------------------------
# Fragments - Reusable Field Selections
# -----------------------------------------------------------------------------

"""Basic user fields"""
fragment UserBasic on User {
  id
  email
  firstName
  lastName
  fullName
  profilePicture
}

"""Auth user fields (after login)"""
fragment AuthUser on User {
  ...UserBasic
  isEmailVerified
  authProvider
  profile {
    isOnboardingCompleted
    isPremium
  }
}

"""Full user profile"""
fragment FullProfile on UserProfile {
  bio
  location
  coordinates
  hasLocation
  searchRadiusKm
  timezone
  birthDate
  phoneNumber
  interests {
    id
    name
    icon
  }
  isOnboardingCompleted
  isProfilePublic
  allowEmailNotifications
  allowPushNotifications
  calendarIntegrated
  calendarProvider
  paymentPlan
  isPremium
  subscriptionExpiresAt
  theme
  lastActiveAt
  loginCount
}

"""Auth payload fields"""
fragment AuthPayloadFields on AuthPayload {
  accessToken
  sessionToken
  refreshToken
  expiresIn
  user {
    ...AuthUser
  }
}

