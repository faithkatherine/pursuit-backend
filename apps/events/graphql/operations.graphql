"""
Copy-paste ready client operations for Events
"""

# ─── FRAGMENTS ────────────────────────────────────────────

"""
Core event fields for list views
"""
fragment EventCard on Event {
  id
  name
  image
  date
  endDate
  locationName
  coordinates
  isFree
  isExternal
  isInternal
  price
  goingCount
  isSaved
  isGoing
  category {
    id
    name
    icon
    color
  }
}

"""
Full event details including user-specific fields
"""
fragment EventDetail on Event {
  id
  name
  description
  image
  date
  endDate
  timezone
  locationName
  coordinates
  moreDetailsUrl
  price
  ticketingEnabled
  availableTickets
  goingCount
  hasGallery
  galleryImages
  galleryDescription
  seriesName
  isFree
  isExternal
  isInternal
  isActive
  isSaved
  isGoing
  hasConfirmedTicket
  isEditorsPick
  curatorNote
  curatorName
  reason
  source
  createdAt
  updatedAt
  category {
    id
    name
    icon
    description
    color
  }
  ticketTiers {
    id
    name
    description
    price
    available
    capacity
    isActive
    sortOrder
  }
  userTicket {
    orderId
    ticketCount
    totalPaid
    tierName
    purchaseDate
  }
}

# ─── QUERIES ──────────────────────────────────────────────

"""
Get all events with filters (default pagination: offset=0, limit=20)
"""
query GetEvents(
  $search: String
  $category: [ID]
  $dateFrom: DateTime
  $dateTo: DateTime
  $latitude: Float
  $longitude: Float
  $radiusKm: Float
  $isFree: Boolean
  $offset: Int
  $limit: Int
) {
  events(
    search: $search
    category: $category
    dateFrom: $dateFrom
    dateTo: $dateTo
    latitude: $latitude
    longitude: $longitude
    radiusKm: $radiusKm
    isFree: $isFree
    offset: $offset
    limit: $limit
  ) {
    ok
    events {
      ...EventCard
    }
  }
}

"""
Get events for map view (with location data)
"""
query GetEventsForMap(
  $latitude: Float
  $longitude: Float
  $radiusKm: Float
  $category: [ID]
  $isFree: Boolean
  $offset: Int
  $limit: Int
) {
  events(
    latitude: $latitude
    longitude: $longitude
    radiusKm: $radiusKm
    category: $category
    isFree: $isFree
    offset: $offset
    limit: $limit
  ) {
    ok
    events {
      id
      name
      date
      locationName
      coordinates
      image
      isFree
      isExternal
      price
      category {
        name
        icon
        color
      }
    }
  }
}

"""
Get a single event by ID with full details
"""
query GetEvent($id: ID!) {
  event(id: $id) {
    ok
    event {
      ...EventDetail
    }
  }
}

"""
Get user's saved events
"""
query GetSavedEvents($offset: Int, $limit: Int) {
  savedEvents(offset: $offset, limit: $limit) {
    ok
    events {
      ...EventCard
    }
  }
}

"""
Get upcoming plans (ticketed + going events)
"""
query GetUpcomingPlans($offset: Int, $limit: Int) {
  upcomingPlans(offset: $offset, limit: $limit) {
    ok
    events {
      ...EventCard
      hasConfirmedTicket
      userTicket {
        orderId
        ticketCount
        totalPaid
        tierName
        purchaseDate
      }
    }
  }
}

"""
Get past plans (past ticketed + going events)
"""
query GetPastPlans($offset: Int, $limit: Int) {
  pastPlans(offset: $offset, limit: $limit) {
    ok
    events {
      ...EventCard
      hasConfirmedTicket
    }
  }
}

# ─── MUTATIONS ────────────────────────────────────────────

"""
Save an event for later
"""
mutation SaveEvent($id: ID!) {
  saveEvent(id: $id) {
    ok
    event {
      id
      name
      isSaved
    }
    errors
  }
}

"""
Remove event from saved list
"""
mutation UnsaveEvent($id: ID!) {
  unsaveEvent(id: $id) {
    ok
    event {
      id
      name
      isSaved
    }
    errors
  }
}

"""
Mark as going to an event (RSVP)
"""
mutation MarkGoing($id: ID!) {
  markGoing(id: $id) {
    ok
    event {
      id
      name
      isGoing
      goingCount
    }
    errors
  }
}

"""
Remove going status from event
"""
mutation UnmarkGoing($id: ID!) {
  unmarkGoing(id: $id) {
    ok
    event {
      id
      name
      isGoing
      goingCount
    }
    errors
  }
}

