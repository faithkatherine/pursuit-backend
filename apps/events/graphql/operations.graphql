"""
Copy-paste ready client operations for Events
"""

# ─── QUERIES ──────────────────────────────────────────────

"""
Get all events (with default pagination: offset=0, limit=20)
"""
query GetEvents {
  getEvents {
    ok
    events {
      id
      name
      description
      category {
        id
        name
        icon
      }
      date
      endDate
      image
      timezone
      locationName
      coordinates
      moreDetailsUrl
      isActive
    }
  }
}

"""
Get events with pagination
"""
query EventsWithPagination($offset: Int, $limit: Int, $category: String) {
  Events(offset: $offset, limit: $limit, category: $category) {
    ok
    events {
      id
      name
      description
      category {
        id
        name
        icon
      }
      date
      endDate
      image
      timezone
      locationName
      coordinates
      moreDetailsUrl
      isActive
    }
  }
}

"""
Get events - minimal fields (for list/card views)
"""
query EventsMinimal($offset: Int, $limit: Int) {
  Events(offset: $offset, limit: $limit) {
    ok
    events {
      id
      name
      image
      date
      locationName
      category {
        name
        icon
      }
    }
  }
}

"""
Get events - with location data (for map views)
"""
query EventsForMap($offset: Int, $limit: Int) {
  Events(offset: $offset, limit: $limit) {
    ok
    events {
      id
      name
      date
      locationName
      coordinates
      image
    }
  }
}

# ─── SINGLE EVENT QUERIES ────────────────────────────────

"""
Get a single event by ID (all fields)
"""
query Event($id: ID!) {
  Event(id: $id) {
    ok
    event {
      id
      name
      description
      category {
        id
        name
        icon
      }
      date
      endDate
      image
      timezone
      locationName
      coordinates
      moreDetailsUrl
      isActive
    }
  }
}

"""
Get a single event - minimal fields (for previews/cards)
"""
query EventMinimal($id: ID!) {
  Event(id: $id) {
    ok
    event {
      id
      name
      image
      date
      locationName
      category {
        name
        icon
      }
    }
  }
}

# ─── MUTATIONS ────────────────────────────────────────────

"""Mutation to save an event for the user"""
mutation SaveEvent($id: ID!) {
  saveEvent(id: $id) {
    ok
    event {
      id
      name
      description
      date
      locationName
      coordinates
      isActive
      isSaved
      category {
        id
        name
      }
    }
    errors
  }
}

"""Mutation to unsave an event for the user"""
mutation UnsaveEvent($id: ID!) {
  unsaveEvent(id: $id) {
    ok
    event {
      id
      name
      isSaved
    }
    errors
  }
}

# ─── SAVED EVENTS QUERIES ────────────────────────────────

"""Get user's saved events"""
query SavedEvents {
  savedEvents {
    ok
    events {
      id
      name
      description
      category {
        id
        name
        icon
      }
      date
      endDate
      image
      timezone
      locationName
      coordinates
      moreDetailsUrl
      isActive
      isSaved
    }
  }
}
