# GraphQL Types for Events

"""
An event with location, date, and category information
"""
type Event {
  id: ID!
  name: String!
  description: String
  category: [Category!]
  date: DateTime!
  endDate: DateTime
  image: String
  timezone: String
  locationName: String
  coordinates: [Float]
  moreDetailsUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
  isActive: Boolean!
  isFree: Boolean!
  isSaved: Boolean!
}

"""
Response payload for event list queries
"""
type EventsListPayload {
  ok: Boolean!
  events: [Event!]!
}

"""
Response payload for single event query
"""
type EventPayload {
  ok: Boolean!
  event: Event
}

type SavedEventPayload {
  ok: Boolean!
  event: Event
  errors: [String!]!
}
