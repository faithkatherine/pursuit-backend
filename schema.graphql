"""Root Query combining all app queries"""
type Query {
  user: UserType
  userProfile: UserProfileType
  events(search: String, category: [ID], dateFrom: DateTime, dateTo: DateTime, latitude: Float, longitude: Float, radiusKm: Float, isFree: Boolean, offset: Int, limit: Int): EventsListPayload
  event(id: ID!): EventPayload
  savedEvents(offset: Int, limit: Int): EventsListPayload
  getRecommendations(offset: Int, limit: Int): [EventType]
  getBucketCategories: [CategoryType]
  getBucketItems(categoryId: String): [BucketItemType]

  """API health check"""
  health: String
}

"""User GraphQL type"""
type UserType {
  """Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only."""
  username: String!
  id: UUID!
  email: String!
  authProvider: UsersUserAuthProviderChoices!
  firstName: String!
  lastName: String
  profilePicture: String
  isActive: Boolean!
  dateJoined: DateTime!
  updatedAt: DateTime!
  lastLoginAt: DateTime
  isEmailVerified: Boolean!
  profile: UserProfileType
  fullName: String
  name: String
  activeSessions: [UserSessionType]
  sessionCount: Int
}

"""
Leverages the internal Python implementation of UUID (uuid.UUID) to provide native UUID objects
in fields, resolvers and input.
"""
scalar UUID

"""An enumeration."""
enum UsersUserAuthProviderChoices {
  """Email"""
  EMAIL

  """Google SSO"""
  GOOGLE
}

"""
The `DateTime` scalar type represents a DateTime
value as specified by
[iso8601](https://en.wikipedia.org/wiki/ISO_8601).
"""
scalar DateTime

"""User profile GraphQL type"""
type UserProfileType {
  bio: String!

  """City, State/Country display name"""
  locationName: String!

  """Default search radius for nearby events in kilometers"""
  searchRadiusKm: Int!
  timezone: String!
  birthDate: Date
  phoneNumber: String!
  isOnboardingCompleted: Boolean!
  hasSkippedOnboarding: Boolean!
  isProfilePublic: Boolean!
  allowLocationSharing: Boolean!
  allowEmailNotifications: Boolean!
  allowPushNotifications: Boolean!
  calendarIntegrated: Boolean!
  calendarProvider: UsersUserProfileCalendarProviderChoices!
  calendarLastSyncedAt: DateTime
  paymentPlan: UsersUserProfilePaymentPlanChoices!
  subscriptionExpiresAt: DateTime
  lastBillingDate: DateTime
  lastActiveAt: DateTime
  loginCount: Int!
  theme: UsersUserProfileThemeChoices!
  createdAt: DateTime!
  updatedAt: DateTime!
  interests: [InterestType]
  coordinates: [Float]
  hasLocation: Boolean
  isPremium: Boolean
}

"""
The `Date` scalar type represents a Date
value as specified by
[iso8601](https://en.wikipedia.org/wiki/ISO_8601).
"""
scalar Date

"""An enumeration."""
enum UsersUserProfileCalendarProviderChoices {
  """None"""
  NONE

  """Google Calendar"""
  GOOGLE_CALENDAR

  """Microsoft Outlook"""
  OUTLOOK

  """Apple Calendar"""
  APPLE_CALENDAR
}

"""An enumeration."""
enum UsersUserProfilePaymentPlanChoices {
  """Free"""
  FREE

  """Basic"""
  BASIC

  """Premium"""
  PREMIUM
}

"""An enumeration."""
enum UsersUserProfileThemeChoices {
  """Light"""
  LIGHT

  """Dark"""
  DARK

  """Auto"""
  AUTO
}

"""Interest GraphQL type"""
type InterestType {
  id: UUID!
  name: String!
  description: String!
  icon: String
  category: CategoryType
}

type CategoryType {
  id: UUID!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  icon: String!
  description: String!
  color: String!
  isActive: Boolean!
  sortOrder: Int!
  interests: [InterestType!]!
  bucketItems: [BucketItemType!]!
  events: [EventType!]!
}

"""GraphQL BucketItem type"""
type BucketItemType {
  id: UUID!
  createdAt: DateTime!
  updatedAt: DateTime!
  category: CategoryType
  title: String!
  description: String!
  locationName: String!
  estimatedCost: Decimal
  priority: BucketsBucketItemPriorityChoices!
  difficulty: BucketsBucketItemDifficultyChoices!
  isCompleted: Boolean!
  progressPercentage: Int!
  amount: Float
  completed: Boolean
  image: String
  categoryId: String
}

"""The `Decimal` scalar type represents a python Decimal."""
scalar Decimal

"""An enumeration."""
enum BucketsBucketItemPriorityChoices {
  """Low"""
  LOW

  """Medium"""
  MEDIUM

  """High"""
  HIGH

  """Urgent"""
  URGENT
}

"""An enumeration."""
enum BucketsBucketItemDifficultyChoices {
  """Easy"""
  EASY

  """Moderate"""
  MODERATE

  """Challenging"""
  CHALLENGING

  """Extreme"""
  EXTREME
}

"""Event GraphQL type"""
type EventType {
  id: ID!
  name: String!
  description: String
  category: [CategoryType!]!
  date: DateTime!
  endDate: DateTime
  image: String
  timezone: String
  locationName: String
  moreDetailsUrl: String
  isFree: Boolean!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  coordinates: [Float]
  isSaved: Boolean
  isEditorsPick: Boolean
  reason: String
  source: String
  curatorNote: String
  curatorName: String
}

"""User session GraphQL type"""
type UserSessionType {
  id: UUID!
  sessionToken: String!
  deviceInfo: String!
  ipAddress: String!
  createdAt: DateTime!
  lastActiveAt: DateTime!
  isActive: Boolean!
}

"""Response payload for paginated event list queries."""
type EventsListPayload {
  ok: Boolean!
  events: [EventType!]!
}

"""Response payload for single event queries."""
type EventPayload {
  ok: Boolean!
  event: EventType
}

"""Trip GraphQL type with cover_image fallback chain."""
type TripType {
  id: ID!
  name: String!
  destination: String!
  startDate: DateTime!
  endDate: DateTime!
  image: String
  events: [EventType!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  coverImage: String
  eventCount: Int
}

"""Root Mutation combining all app mutations"""
type Mutation {
  """Create a new trip."""
  createTrip(destination: String!, endDate: DateTime!, eventIds: [ID], image: String, name: String!, startDate: DateTime!): TripPayload

  """Add an event to an existing trip."""
  addEventToTrip(eventId: ID!, tripId: ID!): TripPayload

  """Remove an event from a trip."""
  removeEventFromTrip(eventId: ID!, tripId: ID!): TripPayload

  """Allow a user to save an event to their profile for later reference."""
  saveEvent(id: ID!): SaveEventPayload

  """Remove an event from the user's saved list."""
  unsaveEvent(id: ID!): SaveEventPayload

  """Add bucket category mutation"""
  addBucketCategory(emoji: String, name: String!): AddBucketCategory

  """Add bucket item mutation"""
  addBucketItem(categoryId: String, description: String, estimatedCost: Float, location: String, title: String!): AddBucketItem

  """Complete onboarding mutation"""
  completeOnboarding(allowEmailNotifications: Boolean, allowLocationSharing: Boolean, allowPushNotifications: Boolean, interests: [String], location: [Float], locationName: String): CompleteOnboarding

  """Enable or update user location from home screen (post-onboarding)"""
  enableLocation(location: [Float]!, locationName: String!): EnableLocation

  """Google sign in mutation - handles both sign up and sign in"""
  googleSignIn(idToken: String!): GoogleSignIn

  """Get new access token using refresh token"""
  refreshAccessToken(refreshToken: String!): RefreshAccessToken

  """Sign in mutation"""
  signIn(email: String!, password: String!): SignIn

  """Sign out mutation - revokes only the current session/device"""
  signOut(refreshToken: String!): SignOut

  """
  Sign out from ALL devices - useful for security (password change, account compromise)
  """
  signOutAll(refreshToken: String!): SignOutAll

  """Sign up mutation"""
  signUp(email: String!, firstName: String!, lastName: String, password: String!): SignUp

  """Skip onboarding mutation"""
  skipOnboarding: SkipOnboarding
}

"""Response payload for trip mutations."""
type TripPayload {
  ok: Boolean!
  trip: TripType
  errors: [String!]
}

"""Response payload for save/unsave event mutations."""
type SaveEventPayload {
  ok: Boolean!
  event: EventType
  errors: [String!]
}

"""Add bucket category mutation"""
type AddBucketCategory {
  category: CategoryType
}

"""Add bucket item mutation"""
type AddBucketItem {
  bucketItem: BucketItemType
}

"""Complete onboarding mutation"""
type CompleteOnboarding {
  ok: Boolean
  user: UserType
}

"""Enable or update user location from home screen (post-onboarding)"""
type EnableLocation {
  ok: Boolean
  user: UserType
}

"""Google sign in mutation - handles both sign up and sign in"""
type GoogleSignIn {
  ok: Boolean
  authPayload: AuthPayloadType
}

"""Standard auth response"""
type AuthPayloadType {
  accessToken: String!
  sessionToken: String!
  refreshToken: String!
  expiresIn: Int
  user: UserType!
}

"""Get new access token using refresh token"""
type RefreshAccessToken {
  ok: Boolean
  accessToken: String
  refreshToken: String
  expiresIn: Int
}

"""Sign in mutation"""
type SignIn {
  ok: Boolean
  authPayload: AuthPayloadType
}

"""Sign out mutation - revokes only the current session/device"""
type SignOut {
  ok: Boolean
}

"""
Sign out from ALL devices - useful for security (password change, account compromise)
"""
type SignOutAll {
  ok: Boolean
}

"""Sign up mutation"""
type SignUp {
  ok: Boolean
  authPayload: AuthPayloadType
  errors: [String]
  userExists: Boolean
  requiresVerification: Boolean
}

"""Skip onboarding mutation"""
type SkipOnboarding {
  user: UserType
  ok: Boolean
}